[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecc-brain"
version = "0.1.0"
description = "Tec-C Brain: off-chain cognitive planner and risk engine for the Tec-C agent wallet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "langgraph==1.2.12",
    "eth-account==0.14.0",
    "eth-abi==5.2.0",
    "apscheduler==3.11.3",
    "httpx==0.28.1",
    "qrcode==8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["tecc_brain*"]

[tool.setuptools.package-data]
tecc_brain = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # starlette>=1.8 nudges TestClient users to httpx2; we keep the established httpx (dev-only).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
