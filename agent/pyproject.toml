[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecc-brain"
version = "0.1.0"
description = "Tec-C Brain: off-chain cognitive planner and risk engine for the Tec-C agent wallet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[tool.setuptools.packages.find]
include = ["tecc_brain*"]

[tool.setuptools.package-data]
tecc_brain = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
